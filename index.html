<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnect to Supabase storage for faster LCP image load -->
    <link rel="preconnect" href="https://ptiwdwfdckfqivoocyvp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ptiwdwfdckfqivoocyvp.supabase.co" />
    <!-- Preconnect to Google Fonts (non render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DM Serif Display — loaded async via print-media swap to avoid blocking FCP -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" /></noscript>
    <link rel="preload" as="image" href="https://ptiwdwfdckfqivoocyvp.supabase.co/storage/v1/object/public/staff-avatars/branding/logo_url_1775436491143.png?width=200&resize=contain&quality=75&format=origin" fetchpriority="high" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#003366" />
    <link rel="apple-touch-icon" href="/pwa-icon-512.png" />
    <title>Sell Your Car for Cash in 2 Minutes | Harte Auto Group</title>
    <link rel="canonical" href="https://hartecash.com/" />
    <meta name="description" content="Get a top-dollar cash offer for your car in 2 minutes. Free pickup, no obligation. Harte Auto Group — trusted since 1952.">
    <meta name="author" content="Harte Auto Group" />
    <!-- Allow rich previews + image previews in SERPs and AI answer cards -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Default OG/Twitter — react-helmet-async overrides per-route -->
    <meta property="og:site_name" content="Harte Auto Group" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://hartecash.com/" />
    <meta property="og:title" content="Sell Your Car for Cash in 2 Minutes | Harte Auto Group" />
    <meta property="og:description" content="Get a top-dollar cash offer for your car in 2 minutes. Free pickup, no obligation. Harte Auto Group — trusted since 1952." />
    <meta property="og:image" content="https://hartecash.com/og-service.jpg" />
    <meta property="og:image:width" content="1344" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Sell your car for cash with Harte Auto Group — 2-minute offer, free pickup." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sell Your Car for Cash in 2 Minutes | Harte Auto Group" />
    <meta name="twitter:description" content="Get a top-dollar cash offer for your car in 2 minutes. Free pickup, no obligation." />
    <meta name="twitter:image" content="https://hartecash.com/og-service.jpg" />
    <meta name="twitter:image:alt" content="Sell your car for cash with Harte Auto Group — 2-minute offer, free pickup." />
</head>

  <body>
    <div id="root">
      <!-- Inline skeleton for fast FCP — replaced by React on mount -->
      <style>
        .ll-sk{display:flex;flex-direction:column;min-height:100vh;background:#fff;font-family:system-ui,sans-serif}
        .ll-sk-h{height:88px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 20px}
        .ll-sk-logo{width:108px;height:72px;background:#f3f4f6;border-radius:8px}
        .ll-sk-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 20px}
        .ll-sk-pulse{animation:ll-p 1.5s ease-in-out infinite}
        @keyframes ll-p{0%,100%{opacity:.4}50%{opacity:1}}
        .ll-sk-bar{height:14px;background:#e5e7eb;border-radius:7px}
      </style>
      <div class="ll-sk">
        <div class="ll-sk-h"><div class="ll-sk-logo ll-sk-pulse"></div></div>
        <div class="ll-sk-main">
          <div class="ll-sk-bar ll-sk-pulse" style="width:260px"></div>
          <div class="ll-sk-bar ll-sk-pulse" style="width:200px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
