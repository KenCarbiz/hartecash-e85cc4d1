<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-hidden="true">
  <defs>
    <style>
      svg { --drive-speed: 0.6s; }

      .stroke { fill: none; stroke: #4A6FA5; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { fill: none; stroke: #4A6FA5; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      .wheel-spin { animation: dc-spin var(--drive-speed) linear infinite; }
      .road-move  { animation: dc-road  calc(var(--drive-speed) * 0.31831) linear infinite; }

      .speed-1 { animation: dc-speed calc(var(--drive-speed) * 1.2) linear infinite; }
      .speed-2 { animation: dc-speed calc(var(--drive-speed) * 1.2) linear infinite; animation-delay: calc(var(--drive-speed) * 0.25); }
      .speed-3 { animation: dc-speed calc(var(--drive-speed) * 1.2) linear infinite; animation-delay: calc(var(--drive-speed) * 0.5); }

      .body-bob { transform-box: fill-box; transform-origin: center; animation: dc-bob calc(var(--drive-speed) * 2.2) ease-in-out infinite; }

      @keyframes dc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes dc-road { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
      @keyframes dc-speed { 0% { opacity: 0; transform: translateX(24px); } 35% { opacity: 0.9; } 100% { opacity: 0; transform: translateX(-32px); } }
      @keyframes dc-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    </style>
  </defs>

  <g class="body-bob">
    <!-- Fastback / sleek sedan silhouette (matches reference) -->
    <!-- Lower body line: front bumper → arches → rear bumper -->
    <path class="stroke" d="
      M 56 152
      Q 48 152 46 146
      L 50 138
      Q 56 132 70 132
      L 250 132
      Q 268 132 274 138
      L 278 146
      Q 276 152 268 152" />

    <!-- Roof / greenhouse arc, flowing into hood and trunk -->
    <path class="stroke" d="
      M 60 132
      Q 64 118 80 110
      L 105 96
      Q 130 86 165 86
      Q 205 86 235 100
      Q 258 112 274 138" />

    <!-- Window outline (single arched glasshouse with light divider) -->
    <path class="stroke-thin" d="
      M 100 116
      Q 110 100 130 96
      L 200 96
      Q 225 100 240 116
      Z" />
    <line class="stroke-thin" x1="170" y1="96" x2="170" y2="116" />

    <!-- Headlight (front, right side of car) -->
    <path class="stroke-thin" d="M 268 138 q 4 1 5 5" />
    <!-- Side mirror hint -->
    <path class="stroke-thin" d="M 92 118 q -4 2 -3 6" />
    <!-- Front fascia notch -->
    <path class="stroke-thin" d="M 50 144 q -3 2 -2 6" />

    <!-- Speed lines along the body (under car / behind motion) -->
    <line class="stroke-thin speed-1" x1="60" y1="148" x2="92" y2="148" />
    <line class="stroke-thin speed-2" x1="120" y1="150" x2="200" y2="150" />
    <line class="stroke-thin speed-3" x1="70" y1="156" x2="105" y2="156" />

    <!-- Wheels (hidden tire arch suggested by body curve; spokes still spin) -->
    <g transform="translate(95 154)">
      <circle class="stroke" cx="0" cy="0" r="14" />
      <g class="wheel-spin">
        <circle class="stroke-thin" cx="0" cy="0" r="8" />
        <line class="stroke-thin" x1="-8" y1="0" x2="8" y2="0" />
        <line class="stroke-thin" x1="0" y1="-8" x2="0" y2="8" />
        <line class="stroke-thin" x1="-5.7" y1="-5.7" x2="5.7" y2="5.7" />
        <line class="stroke-thin" x1="-5.7" y1="5.7" x2="5.7" y2="-5.7" />
      </g>
    </g>
    <g transform="translate(238 154)">
      <circle class="stroke" cx="0" cy="0" r="14" />
      <g class="wheel-spin">
        <circle class="stroke-thin" cx="0" cy="0" r="8" />
        <line class="stroke-thin" x1="-8" y1="0" x2="8" y2="0" />
        <line class="stroke-thin" x1="0" y1="-8" x2="0" y2="8" />
        <line class="stroke-thin" x1="-5.7" y1="-5.7" x2="5.7" y2="5.7" />
        <line class="stroke-thin" x1="-5.7" y1="5.7" x2="5.7" y2="-5.7" />
      </g>
    </g>
  </g>

  <!-- Moving road -->
  <line class="stroke road-move" x1="20" y1="178" x2="300" y2="178" stroke-dasharray="16 16" />
</svg>
