<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-hidden="true">
  <defs>
    <style>
      .stroke { fill: none; stroke: #4A6FA5; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { fill: none; stroke: #4A6FA5; stroke-width: 1.8; stroke-linecap: round; }
      /* Wheel rotates around its own local origin (0,0) inside its translate group */
      .wheel-spin { animation: dc-spin 0.45s linear infinite; }
      .road-move { animation: dc-road 0.45s linear infinite; }
      .speed-1 { animation: dc-speed 0.6s linear infinite; }
      .speed-2 { animation: dc-speed 0.6s linear infinite; animation-delay: 0.12s; }
      .speed-3 { animation: dc-speed 0.6s linear infinite; animation-delay: 0.24s; }
      .body-bob { transform-box: fill-box; transform-origin: center; animation: dc-bob 1.2s ease-in-out infinite; }
      @keyframes dc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      /* Dash pattern is 16+16 = 32; scroll one full cycle per iteration for seamless loop */
      @keyframes dc-road { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
      @keyframes dc-speed { 0% { opacity: 0; transform: translateX(20px); } 30% { opacity: 0.9; } 100% { opacity: 0; transform: translateX(-30px); } }
      @keyframes dc-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    </style>
  </defs>

  <!-- Speed lines behind the car -->
  <g>
    <line class="stroke-thin speed-1" x1="60" y1="118" x2="95" y2="118" />
    <line class="stroke-thin speed-2" x1="50" y1="135" x2="85" y2="135" />
    <line class="stroke-thin speed-3" x1="65" y1="150" x2="100" y2="150" />
  </g>

  <!-- Car body group (subtle bob) -->
  <g class="body-bob">
    <!-- Hatchback silhouette -->
    <path class="stroke" d="
      M 95 145
      L 100 120
      Q 108 95 135 88
      L 200 85
      Q 230 86 250 102
      L 268 118
      L 280 130
      L 280 145
      Z" />
    <!-- Window outline -->
    <path class="stroke-thin" d="
      M 130 118
      Q 138 100 158 96
      L 205 95
      Q 225 96 240 108
      L 250 118
      Z" />
    <!-- Window divider -->
    <line class="stroke-thin" x1="180" y1="96" x2="180" y2="118" />
    <line class="stroke-thin" x1="210" y1="95" x2="212" y2="118" />
    <!-- Door line / rocker -->
    <line class="stroke-thin" x1="125" y1="145" x2="265" y2="145" />
    <!-- Headlight -->
    <path class="stroke-thin" d="M 272 128 q 6 2 6 8" />
    <!-- Side mirror hint -->
    <path class="stroke-thin" d="M 108 118 q -4 2 -4 6" />

    <!-- Front wheel: outer tire stays put, inner spokes spin around 0,0 of the translated group -->
    <g transform="translate(135 150)">
      <circle class="stroke" cx="0" cy="0" r="16" />
      <g class="wheel-spin">
        <circle class="stroke-thin" cx="0" cy="0" r="9" />
        <line class="stroke-thin" x1="-9" y1="0" x2="9" y2="0" />
        <line class="stroke-thin" x1="0" y1="-9" x2="0" y2="9" />
        <line class="stroke-thin" x1="-6.4" y1="-6.4" x2="6.4" y2="6.4" />
        <line class="stroke-thin" x1="-6.4" y1="6.4" x2="6.4" y2="-6.4" />
      </g>
    </g>
    <g transform="translate(245 150)">
      <circle class="stroke" cx="0" cy="0" r="16" />
      <g class="wheel-spin">
        <circle class="stroke-thin" cx="0" cy="0" r="9" />
        <line class="stroke-thin" x1="-9" y1="0" x2="9" y2="0" />
        <line class="stroke-thin" x1="0" y1="-9" x2="0" y2="9" />
        <line class="stroke-thin" x1="-6.4" y1="-6.4" x2="6.4" y2="6.4" />
        <line class="stroke-thin" x1="-6.4" y1="6.4" x2="6.4" y2="-6.4" />
      </g>
    </g>
  </g>

  <!-- Moving road (dashed). Wheel circumference 2π·16 ≈ 100; one rotation per 0.45s = ~222 px/s,
       road scrolls 32 px per 0.45s = ~71 px/s — visually balanced for "driving" feel without strobing. -->
  <line
    class="stroke road-move"
    x1="20" y1="178" x2="300" y2="178"
    stroke-dasharray="16 16" />
</svg>
